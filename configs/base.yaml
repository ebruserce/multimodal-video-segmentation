paths:
  models:
    pose_landmarker: models/pose_landmarker_heavy.task
    object_detector: models/object_detector_lite0.tflite
  data:
    input_images: data/input/images
    input_videos: data/input/videos
    output: data/output

settings:
  video_input_extension: "*.avi"
  video_output_extension: "mp4v"
  alpha: 0.7
  num_poses: 2
  segmentation_threshold: 0.5
  max_results: 10
  score_threshold: 0.2
  min_radius: 20
  min_thickness: 15
  mask_dilation_kernel: 21  # pixels to expand beyond body border, must be odd

pose_landmarks:
  - NOSE
  - LEFT_EYE_INNER
  - LEFT_EYE
  - LEFT_EYE_OUTER
  - RIGHT_EYE_INNER
  - RIGHT_EYE
  - RIGHT_EYE_OUTER
  - LEFT_EAR
  - RIGHT_EAR
  - MOUTH_LEFT
  - MOUTH_RIGHT
  - LEFT_SHOULDER
  - RIGHT_SHOULDER
  - LEFT_ELBOW
  - RIGHT_ELBOW
  - LEFT_WRIST
  - RIGHT_WRIST
  - LEFT_PINKY
  - RIGHT_PINKY
  - LEFT_INDEX
  - RIGHT_INDEX
  - LEFT_THUMB
  - RIGHT_THUMB
  - LEFT_HIP
  - RIGHT_HIP
  - LEFT_KNEE
  - RIGHT_KNEE
  - LEFT_ANKLE
  - RIGHT_ANKLE
  - LEFT_HEEL
  - RIGHT_HEEL
  - LEFT_FOOT_INDEX
  - RIGHT_FOOT_INDEX